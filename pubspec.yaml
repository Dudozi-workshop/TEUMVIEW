name: teumview
description: Customizable fullscreen personal dashboard
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  google_sign_in: ^7.2.0
  http: ^1.2.2
  battery_plus: ^6.2.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  screen_brightness: ^2.1.0
  wakelock_plus: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
